name: "Play Store Metadata"

on:
  push:
    paths:
      - "fastlane/**"

jobs:
  deploy-metadata:
    name: "Push metadata to Play Store"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: "Checkout ${{ github.repository }}@${{ github.ref_name }}"
        uses: actions/checkout@v7

      - name: "Authenticate to Google Cloud"
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: almanac-510717
          workload_identity_provider: projects/898624179254/locations/global/workloadIdentityPools/github/providers/almanac-github-provider
          service_account: github-actions@almanac-510717.iam.gserviceaccount.com

      - name: "Setup Ruby"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: "Push metadata with Fastlane"
        run: |
          bundle exec fastlane supply \
            --version_code "76" \
            --json_key "${{ steps.auth.outputs.credentials_file_path }}"
