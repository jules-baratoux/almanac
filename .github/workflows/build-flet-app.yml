name: Debug Keystore

on:
  push:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Print end of password
        env:
          FLET_ANDROID_SIGNING_KEY_PASSWORD: "${{ github.secrets.ANDROID_KEYSTORE_PASSWORD }}"
          FLET_ANDROID_SIGNING_KEY_STORE: "${{ runner.temp }}/keystore.jks"
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: "${{ github.secrets.ANDROID_KEYSTORE_PASSWORD }}"
          ANDROID_KEYSTORE_BASE64: "${{ github.secrets.ANDROID_KEYSTORE_BASE64 }}"
        shell: bash
        run: |
          set -euov
          
          # Print end of password
          echo "${FLET_ANDROID_SIGNING_KEY_PASSWORD: -4}"
          
          # Print end of keystore base64
          echo "${ANDROID_KEYSTORE_BASE64: -10}"
