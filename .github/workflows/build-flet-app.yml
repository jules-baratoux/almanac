name: "Build Flet App"

on:
  push:
  workflow_dispatch:

jobs:
  flet-test:
    name: "Install uv, list Flet APT packages, install & cache packages"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: "Checkout ${{ github.repository }}@${{ github.ref_name }}"
        uses: actions/checkout@v7

      - name: "Install uv"
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: "true"
          cache-suffix: ${{ github.job }}

      - name: "Unit tests"
        shell: bash
        run: >-
          uv run pytest -m "not integration"

      - name: "Set up job"
        id: prepare
        env:
          ACTION_TARGET: "linux"
          PYTHONUTF8: "1"
          FLET_CLI_NO_RICH_OUTPUT: "1"
        shell: bash
        run: >-
          uv run python .github/scripts/flet_action.py prepare

      - name: "Cache Flutter SDK"
        uses: actions/cache@v6
        with:
          path: ~/flutter/${{ steps.prepare.outputs.flutter-version }}
          key: flet-flutter-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.flutter-version }}

      - name: "Cache Flet downloads"
        uses: actions/cache@v6
        with:
          path: ~/.flet/cache
          key: flet-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.prepare.outputs.flet-version }}-py${{ inputs.bundled-python-version || 'auto' }}

      - name: "Run APT install"
        if: steps.prepare.outputs.install-linux-dependencies == 'true'
        shell: bash
        run: |
          set -euo pipefail
          
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "::error::Linux dependency installation requires apt-get. Set install-linux-dependencies to false and provision this runner manually."
            exit 1
          fi
          
          mapfile -t packages < "${{ steps.prepare.outputs.linux-dependencies-file }}"
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "::error::Flet did not report any Linux build dependencies."
            exit 1
          fi
          
          if [[ ${EUID} -eq 0 ]]; then
            apt-get update --allow-releaseinfo-change
            apt-get install -y --no-install-recommends "${packages[@]}"
          elif command -v sudo >/dev/null 2>&1; then
            sudo apt-get update --allow-releaseinfo-change
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          else
            echo "::error::Linux dependency installation requires root or sudo. Set install-linux-dependencies to false and provision this runner manually."
            exit 1
          fi

      - name: "Integration tests"
        env:
          PYTHONUTF8: "1"
          FLET_CLI_NO_RICH_OUTPUT: "1"
        shell: bash
        run: >-
          xvfb-run -a --server-args="-screen 0 1280x1024x24"
          uv run flet test --yes -- -m integration

      - name: "Build AAB"
        id: aab
        env:
          ACTION_BUILD_NUMBER: ${{ github.run_number }}
          ACTION_BUILD_VERSION: "0.1.1"
          ACTION_OUTPUT_PATH: build/aab
          ACTION_TARGET: aab
          FLET_ANDROID_SIGNING_KEY_ALIAS: upload
          FLET_ANDROID_SIGNING_KEY_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          FLET_ANDROID_SIGNING_KEY_STORE: "${{ runner.temp }}/keystore.jks"
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          FLET_CLI_NO_RICH_OUTPUT: "1"
          PYTHONUTF8: "1"
        shell: bash
        run: |
          set -euvo pipefail
          
          # Decode keystore from secrets to file
          base64 --decode --ignore-garbage <<< "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" > "$FLET_ANDROID_SIGNING_KEY_STORE"
          
          # Use keytool to verify variables and decoding
          keytool -list \
            -alias "$FLET_ANDROID_SIGNING_KEY_ALIAS" \
            -keystore "$FLET_ANDROID_SIGNING_KEY_STORE" \
            -storepass "$FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD"
          
          # Flet build
          uv run python .github/scripts/flet_action.py build
          
          # Export built vars to output
          uv run python .github/scripts/actions.py export build/flutter/.vars bundle_id >> $GITHUB_OUTPUT

      - name: "Upload AAB artifact"
        uses: actions/upload-artifact@v7
        with:
          path: build/aab/almanac.aab
          retention-days: 7
          archive: false
          if-no-files-found: error

      - name: "Authenticate to Google Cloud"
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: almanac-510717
          workload_identity_provider: projects/898624179254/locations/global/workloadIdentityPools/github/providers/almanac-github-provider
          service_account: github-actions@almanac-510717.iam.gserviceaccount.com

      - name: "Upload to Google Play"
        uses: r0adkll/upload-google-play@v1
        with:
          packageName: ${{ steps.aab.outputs.bundle_id }}
          releaseFiles: build/aab/almanac.aab
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          tracks: internal
          whatsNewDirectory: distribution/whatsnew
