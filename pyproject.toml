[project]
name = "almanac"
description = "Almanac of popular events."
readme = "README.md"

# Requires Python 3.12+ for PEP 695 type parameter syntax.
# Capped below Python 3.14 due to stack measurement check issues with beartype.
# Remove `pythonbackport-sentinel` when upgrading to 3.15+
requires-python = ">=3.12, <3.14"

dynamic = ["version"]
authors = [
    { name = "Jules Baratoux", email = "jules.baratoux+almanac@gmail.com" }
]
dependencies = [
    "annotated-types>=0.8.0",
    "beartype>=0.23.1",
    "flet==1.1.0.dev4",
    "holidays>=0.107",
    "millify>=0.1.1",
    "python-dateutil>=2.9.0.post0",
    "python-slugify>=9.1.3",
    "pythonbackport-sentinel>=0.1.0",
]

[dependency-groups]
dev = [
    "faker>=40.43.0",
    "flet-cli==1.1.0.dev4",
    "flet-desktop==1.1.0.dev4",
    "flet-web==1.1.0.dev4",
    "flet[test]==1.1.0.dev4",
    "pytest~=9.1",
]

[tool.pytest.ini_options]
addopts = "--doctest-modules --capture=tee-sys --show-capture=all --log-cli-level=INFO"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests", "src"]
python_files = ["*.py"]
pythonpath = ["src"]
markers = [
    "ui: Flet integration tests that launch the app host"
]

[tool.flet]
org = "fr.baratoux.jules"
product = "Almanac"
icon_background = "#111827"

[tool.flet.app]
path = "src"

[tool.flet.splash]
color = "#111827"
dark_color = "#111827"

[tool.flet.android.signing]
key_store = "C:/Users/jules/keystores/fr.baratoux.jules.almanac.jks"
key_alias = "upload"
